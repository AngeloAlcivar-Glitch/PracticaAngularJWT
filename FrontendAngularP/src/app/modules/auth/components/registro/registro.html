<div class="registro">


<h2>Registro de Usuario</h2>


<input
type="text"
placeholder="Nombre"
[(ngModel)]="nombre">


<input
type="email"
placeholder="Correo"
[(ngModel)]="correo">


<input
type="password"
placeholder="Contraseña"
[(ngModel)]="password">


<button
(click)="registrar()">

Registrarse

</button>


</div>
