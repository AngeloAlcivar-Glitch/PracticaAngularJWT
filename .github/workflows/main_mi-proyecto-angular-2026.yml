name: Build and deploy Angular SSR to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: FrontendAngularP/package-lock.json

      - name: Instalar dependencias
        working-directory: FrontendAngularP
        run: npm ci

      - name: Compilar Angular SSR
        working-directory: FrontendAngularP
        run: npm run build

      - name: Preparar archivos para Azure
        working-directory: FrontendAngularP
        run: |
          mkdir deploy
          cp package.json package-lock.json deploy/
          cp -r dist deploy/
          cd deploy
          npm ci --omit=dev

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: FrontendAngularP/deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: angular-app
          path: app

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mi-proyecto-angular-2026'
          slot-name: 'Production'
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_40D8D3FA02924620BBF33285061E47D3 }}
