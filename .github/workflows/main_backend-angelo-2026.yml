# Docs for the Azure Web Apps Deploy action
name: Build and deploy Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependencias
        working-directory: Backend
        run: npm install

      - name: Preparar backend
        run: |
          mkdir backend-deploy
          cp -r Backend/src backend-deploy/
          cp Backend/package.json backend-deploy/
          cp Backend/package-lock.json backend-deploy/
          cd backend-deploy
          npm ci --omit=dev

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: app

      - name: Publicar backend en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-angelo-2026'
          slot-name: 'Production'
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DE1E7DEAA2D04C6CA4B9F0F43A84C481 }}
